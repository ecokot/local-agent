[project]
name = "local-agent"
version = "0.1.0"
description = "Local autonomous Python coding agent"
readme = "README.md"
authors = [
    { name = "Anatoly", email = "" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.49.0",
    "pydantic>=2.14.3",
]

[project.scripts]
local-agent = "local_agent:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
