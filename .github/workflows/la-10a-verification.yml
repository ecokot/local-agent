name: LA-10A Developer verification

on:
  push:
    branches:
      - stage-10a-automatic-recovery

permissions:
  contents: read

jobs:
  verify:
    name: Python 3.12 checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out tested commit and full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked project and development dependencies
        run: uv sync --locked --all-groups

      - name: Run targeted RecoveryManager and startup tests
        run: uv run pytest -v test/test_recovery_manager.py test/test_application_startup.py

      - name: Run full test suite
        run: uv run pytest -v

      - name: Run Ruff
        run: uv run ruff check .

      - name: Check diff against LA-10A base
        run: git diff --check 1b4d709d0f391a847727c34abf2b50a841436463 HEAD
